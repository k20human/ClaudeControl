# The whole thing: a session, the hologram, statistics, service checks and
# tasks.
# Run with: ./bin/claudecontrol -config examples/control-centre.yaml
layout:
  split: horizontal
  ratios: [3, 2]
  children:
    - module: claude
      options:
        dir: ~/GolandProjects/ClaudeControl
    - split: vertical
      ratios: [2, 1, 1, 1]
      children:
        - module: hologram
          options: { style: sphere }
        # Token use per session, and the account's five-hour and weekly
        # budgets. The budgets are the only thing in this application that
        # reaches the network: they are read with the OAuth token Claude Code
        # stores, from an internal endpoint with no compatibility promise.
        # Set account: false to keep everything local — the per-session
        # figures come from the transcripts and cost nothing.
        - module: stats
          options:
            interval: 180
            account: true
        - module: services
          options:
            interval: 5
            checks:
              # Replace these with the things you actually watch.
              - name: network
                cmd: [sh, -c, "ip route | grep -q default"]
              - name: docker
                cmd: [sh, -c, "test -S /var/run/docker.sock"]
        - module: tasks
          options:
            tasks:
              - name: test
                cmd: [go, test, ./...]
                dir: ~/GolandProjects/ClaudeControl
              - name: build
                cmd: [go, build, ./...]
                dir: ~/GolandProjects/ClaudeControl
