# Two Claude Code sessions with the hologram beside them.
# Run with: ./bin/claudecontrol -config examples/two-claude.yaml
layout:
  split: horizontal
  ratios: [3, 2, 2]
  children:
    - module: claude
      options:
        dir: ~/GolandProjects/ClaudeControl
    - module: claude
      options:
        dir: ~/DEV
    - stack:
        - module: hologram
          options: { style: sphere }
        - module: sessions
